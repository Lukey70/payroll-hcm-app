<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Payroll/HCM App</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="loginScreen" class="login-screen">
    <div class="login-card">
      <h1>Payroll/HCM Login</h1>
      <p class="muted">Enter your password to continue.</p>
      <label for="loginPassword">Password</label>
      <input id="loginPassword" type="password" autocomplete="current-password">
      <button id="loginButton" type="button">Sign in</button>
      <p id="loginError" class="error-text"></p>
    </div>
  </div>

  <div id="processingScreen" class="processing-screen" aria-live="polite">
    <div>
      <div class="spinner"></div>
      <h2 id="processingTitle">Overnight Processing in Progress</h2>
      <p>Login is temporarily disabled while processing is completed.</p>
    </div>
  </div>

  <div class="app-shell" id="appShell">
    <aside class="sidebar no-print">
      <div>
        <h1>Payroll/HCM</h1>
        <p id="versionLabel">v1.1.1</p>
      </div>
      <nav class="nav">
        <button class="nav-btn active" data-tab="employees">Employees</button>
        <button class="nav-btn" data-tab="changeCentre">Change Centre</button>
        <button class="nav-btn" data-tab="jobSummary">Job Summary</button>
        <button class="nav-btn" data-tab="additionalEarnings">Additional Earnings</button>
        <button class="nav-btn" data-tab="taxDetails">Tax Details</button>
        <button class="nav-btn" data-tab="leave">Leave</button>
        <button class="nav-btn" data-tab="absenceBalance">Absence Balance</button>
        <button class="nav-btn" data-tab="payslip">Payslip</button>
        <button class="nav-btn" data-tab="certification">Certification Report</button>
        <button class="nav-btn" data-tab="audit">Audit</button>
        <button class="nav-btn" data-tab="settings">Settings</button>
      </nav>
      <button id="logoutButton" type="button" class="logout-btn">Log Out</button>
    </aside>

    <main>
      <div class="top-actions no-print">
        <button id="calculatePayButton" type="button">Calculate Pay</button>
        <button id="importDataButton" type="button" class="secondary">Import Data</button>
        <button id="exportDataButton" type="button" class="success">Export Data</button>
        <input id="importFile" type="file" accept="application/json" hidden>
      </div>

      <div class="metric-grid">
        <div class="card metric"><span>Employees</span><strong id="metricEmployees">0</strong></div>
        <div class="card metric"><span>Current Pay Gross</span><strong id="metricGross">$0.00</strong></div>
        <div class="card metric"><span>Retro / Arrears</span><strong id="metricRetro">$0.00</strong></div>
        <div class="card metric"><span>Current Open Pay</span><strong id="metricPayStatus">PPE4/6/26</strong></div>
      </div>

      <section id="employees" class="tab-section card active"></section>
      <section id="changeCentre" class="tab-section card"></section>
      <section id="jobSummary" class="tab-section card"></section>
      <section id="additionalEarnings" class="tab-section card"></section>
      <section id="taxDetails" class="tab-section card"></section>
      <section id="leave" class="tab-section card"></section>
      <section id="absenceBalance" class="tab-section card"></section>
      <section id="payslip" class="tab-section card"></section>
      <section id="certification" class="tab-section card"></section>
      <section id="audit" class="tab-section card"></section>
      <section id="settings" class="tab-section card"></section>
    </main>
  </div>

  <div id="modalRoot" class="modal-root no-print" aria-live="polite"></div>
  <div id="toast" class="toast no-print"></div>
  <div id="printArea"></div>

  <script src="data-store.js"></script>
  <script src="payroll-engine.js"></script>
  <script src="app.js"></script>
</body>
</html>
