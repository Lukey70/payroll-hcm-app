<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Payroll/HCM App v1.1.11</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <section id="loginScreen" class="login-screen">
    <div class="login-card">
      <h1>Payroll/HCM</h1>
      <p class="muted">Advanced payroll demo app</p>
      <label for="passwordInput">Password</label>
      <input id="passwordInput" type="password" autocomplete="current-password" placeholder="Enter password">
      <button id="loginButton">Log In</button>
      <p id="loginError" class="login-error"></p>
      <small>Demo password: 1234</small>
    </div>
  </section>

  <section id="app" class="app">
    <aside class="sidebar">
      <div class="brand">Payroll/HCM</div>
      <div class="version">v1.1.11</div>
      <nav id="nav"></nav>
      <button id="logoutButton" class="logout">Log Out</button>
    </aside>

    <header class="topbar">
      <div class="top-actions">
        <button id="calculatePayBtn">Calculate Pay</button>
        <label class="secondary-file button-label">
          <input id="importFile" type="file" accept="application/json" hidden>
          <button id="importDataBtn" type="button" class="secondary">Import Data</button>
        </label>
        <button id="exportDataBtn" class="secondary">Export Data</button>
      </div>
      <div class="metric-strip">
        <div class="metric"><div class="label">Employees</div><div id="metricEmployees" class="value">0</div></div>
        <div class="metric"><div class="label">Current Pay Gross</div><div id="metricGross" class="value">$0.00</div></div>
        <div class="metric"><div class="label">Retro/Arrears</div><div id="metricRetro" class="value">$0.00</div></div>
        <div class="metric"><div class="label">Current Pay</div><div id="metricPeriod" class="value">PPE 04/06/2026</div></div>
      </div>
      <div class="alert-wrap">
        <button id="alertsBell" class="bell" aria-label="Alerts">🔔<span id="alertsBadge" class="alert-badge">0</span></button>
        <div id="alertsDropdown" class="alerts-dropdown"></div>
      </div>
    </header>

    <main id="main" class="main">
      <section id="dashboard" class="tab active"></section>
      <section id="personalDetails" class="tab"></section>
      <section id="bankDetails" class="tab"></section>
      <section id="taxDetails" class="tab"></section>
      <section id="superDetails" class="tab"></section>
      <section id="jobSummary" class="tab"></section>
      <section id="additionalEarnings" class="tab"></section>
      <section id="leave" class="tab"></section>
      <section id="payslip" class="tab"></section>
      <section id="certification" class="tab"></section>
      <section id="deductions" class="tab"></section>
      <section id="audit" class="tab"></section>
      <section id="settings" class="tab"></section>
    </main>
  </section>

  <div id="modalBackdrop" class="modal-backdrop" role="dialog" aria-modal="true">
    <div class="modal">
      <div id="modalTitle" class="modal-header"></div>
      <div id="modalBody" class="modal-body"></div>
      <div id="modalFooter" class="modal-footer"></div>
    </div>
  </div>
  <div id="toast" class="toast"></div>
  <div id="processing" class="processing"><span class="spinner"></span><span id="processingText">Processing</span></div>

  <script src="data-store.js"></script>
  <script src="payroll-engine.js"></script>
  <script src="app.js"></script>
</body>
</html>
